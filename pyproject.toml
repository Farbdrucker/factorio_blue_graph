[project]
name = "factorio-blue-graph"
version = "0.1.0"
description = "Graph-based optimizer for Factorio blueprints (throughput + footprint)."
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "ortools>=9.15.6755",
    "pulp>=3.3.1",
    "pydantic>=2.13.4",
    "python-louvain>=0.16",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.25.1",
]

[project.scripts]
fbg = "factorio_blue_graph.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
